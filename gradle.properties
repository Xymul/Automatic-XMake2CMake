kotlin.code.style=official

# The IntelliJ Platform Gradle Plugin warns that the Kotlin stdlib is added automatically and may
# conflict with the stdlib bundled in the IntelliJ Platform (see https://jb.gg/intellij-platform-kotlin-stdlib).
kotlin.stdlib.default.dependency=false

# ---------------------------------------------------------------------------
# Local, read-only environment configuration for this project.
# Nothing here may be installed into or written to the IDE installation.
# ---------------------------------------------------------------------------

# IntelliJ Platform (SDK) used to compile against: the locally installed CLion.
# It is only read by Gradle / the IntelliJ Platform Gradle Plugin.
localIdePath=D:/JetBrains/CLion 2026.2.0.1

# The already existing XMake plugin (io.xmake) this plugin integrates with.
# It is resolved from JetBrains Marketplace into GRADLE_USER_HOME (D:\Environment\gradle.repo)
# and installed into the runIde sandbox inside this project build directory.
xmakePluginId=io.xmake
xmakePluginVersion=1.4.23

# Java toolchains available on this machine (comma separated, checked by Gradle).
#   D:/Java/jdk-23                      - standalone JDK 23
#   D:/JetBrains/CLion 2026.2.0.1/jbr   - JetBrains Runtime 25.0.3 bundled with CLion (read-only use)
org.gradle.java.installations.paths=D:/Java/jdk-23,D:/JetBrains/CLion 2026.2.0.1/jbr